<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16211a" />
  <meta name="description" content="Crafting shopping list for the game Outbound — pick crafts, gather resources, tick them off." />
  <title>Outbound Craft</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">Outbound Craft</h1>
    <span id="data-version" class="data-version"></span>
    <button id="lang-toggle" type="button" class="lang-toggle">FR</button>
  </header>

  <p id="app-error" class="app-error" hidden></p>

  <main>
    <section id="section-crafts" aria-labelledby="crafts-heading">
      <h2 id="crafts-heading">Crafts</h2>
      <input id="craft-search" type="search" autocomplete="off" placeholder="Search craftable items…" />
      <ul id="search-results" class="search-results" hidden></ul>
      <p id="allocation-hint" class="hint"></p>
      <ul id="selected-list" class="selected-list"></ul>
    </section>

    <section id="section-breakdown" aria-labelledby="breakdown-heading">
      <h2 id="breakdown-heading">Breakdown</h2>
      <div id="tree-container"></div>
    </section>

    <section id="section-shopping" aria-labelledby="shopping-heading">
      <h2 id="shopping-heading">Shopping list</h2>
      <ul id="shopping-list" class="shopping-list"></ul>
      <button id="reset-gathered" type="button" class="reset-btn" hidden></button>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
